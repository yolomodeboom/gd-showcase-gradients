name: Build Artwork For All Five Sorts

on:
  push:
    branches: [main]
    paths:
      - "generate_sorts.py"
      - "sorts_snapshot.json"
      - ".github/workflows/build-five-sorts.yml"
  repository_dispatch:
    types: [five-sorts-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: five-sorts-artwork
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate all ten PNGs
        run: python generate_sorts.py
      - name: Publish artwork
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/sorts/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh five sorted showcases [skip ci]"
            git push origin HEAD:main
          fi
